<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ikram OTC Dashboard</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #08111f;
    color: white;
}

.header {
    background: #0d1b2e;
    padding: 18px;
    text-align: center;
    border-bottom: 1px solid #263a52;
}

.header h1 {
    color: #4da3ff;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.card {
    background: #101f33;
    border: 1px solid #263a52;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
}

select {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: none;
    margin-top: 10px;
    font-size: 16px;
}

.price {
    text-align: center;
    font-size: 35px;
    margin: 20px 0;
    color: #4da3ff;
}

.chart {
    height: 250px;
    background:
        linear-gradient(#1c3048 1px, transparent 1px),
        linear-gradient(90deg, #1c3048 1px, transparent 1px);
    background-size: 40px 40px;
    border-radius: 10px;
    position: relative;
    overflow: hidden;
}

.line {
    position: absolute;
    width: 100%;
    height: 100%;
}

.signal {
    text-align: center;
    padding: 20px;
    border-radius: 12px;
    background: #162a42;
}

.signal h2 {
    font-size: 32px;
    margin: 10px;
}

.buy {
    color: #20d47b;
}

.sell {
    color: #ff5263;
}

.timer {
    text-align: center;
    font-size: 22px;
    margin-top: 15px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: none;
    border-radius: 8px;
    background: #1261a0;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

button:hover {
    background: #1878c9;
}

.back {
    display: block;
    text-align: center;
    color: #4da3ff;
    text-decoration: none;
    margin-top: 20px;
}

.footer {
    text-align: center;
    padding: 20px;
    color: #8da2b8;
}

@media (max-width: 600px) {
    .container {
        padding: 12px;
    }

    .price {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>Ikram OTC</h1>
    <p>OTC Signal Demo Dashboard</p>
</div>

<div class="container">

    <div class="card">
        <h3>Select OTC Pair</h3>

        <select id="pair">
            <option>EUR/USD OTC</option>
            <option>GBP/USD OTC</option>
            <option>USD/JPY OTC</option>
            <option>AUD/USD OTC</option>
        </select>
    </div>

    <div class="card">

        <h3>Market Price</h3>

        <div class="price" id="price">
            1.08542
        </div>

        <div class="chart">
            <svg class="line" viewBox="0 0 500 250"
                 preserveAspectRatio="none">

                <polyline
                    points="0,180 40,160 80,190 120,130 160,150 200,100 240,120 280,80 320,110 360,70 400,90 440,50 500,70"
                    fill="none"
                    stroke="#4da3ff"
                    stroke-width="4"/>
            </svg>
        </div>

    </div>

    <div class="card signal">

        <p>Demo Signal</p>

        <h2 id="signal" class="buy">
            BUY
        </h2>

        <p>Signal generated for demonstration only.</p>

        <div class="timer">
            Next signal in:
            <strong id="timer">60</strong>s
        </div>

        <button onclick="generateSignal()">
            Generate Signal
        </button>

    </div>

    <a class="back" href="index.html">
        ← Back to Ikram Web
    </a>

</div>

<div class="footer">
    © 2026 Ikram OTC Demo
</div>
